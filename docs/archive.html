<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아티클 — Life After AI</title>
<link rel="stylesheet" href="./shared.css">
<style>
body { padding-bottom: 64px; }

/* ── Page sub-header ──────────────────────────────────────── */
.hd {
  padding: 14px 24px;
  border-bottom: 0.5px solid var(--hairline);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--canvas);
}
.hd-left  { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.hd-title { font-family: var(--font-display); font-size: 20px; font-weight: 400; letter-spacing: -0.02em; white-space: nowrap; color: var(--ink); }
.hd-sub   { font-size: 13px; color: var(--muted-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Filter bar ────────────────────────────────────────────── */
.filters{
  padding:10px 24px;border-bottom:0.5px solid var(--hairline);
  display:flex;align-items:center;gap:6px;overflow-x:auto;
  background:var(--canvas);position:sticky;top:64px;z-index:19;
  scrollbar-width:none
}
.filters::-webkit-scrollbar{display:none}
.f-sep{width:0.5px;height:16px;background:var(--hairline);flex-shrink:0;margin:0 2px}
.f-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
.chip{
  font-size:12px;font-weight:500;padding:5px 14px;border-radius:9999px;
  cursor:pointer;flex-shrink:0;border:0.5px solid transparent;
  transition:all .12s;user-select:none;white-space:nowrap
}
/* all chip */
.chip-all{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.chip-all.off{background:transparent;color:var(--muted);border-color:var(--hairline)}
.chip-all.off:hover{background:var(--surface-card);color:var(--ink);border-color:var(--hairline-soft)}
/* group chips */
.chip-g1{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-b)}
.chip-g1.off{background:transparent;color:var(--text3);border-color:var(--border)}
.chip-g1.off:hover{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-b)}
.chip-g2{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-b)}
.chip-g2.off{background:transparent;color:var(--text3);border-color:var(--border)}
.chip-g2.off:hover{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-b)}
.chip-g3{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.chip-g3.off{background:transparent;color:var(--text3);border-color:var(--border)}
.chip-g3.off:hover{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.chip-g4{background:var(--accent-lt);color:var(--accent);border-color:var(--accent)}
.chip-g4.off{background:transparent;color:var(--text3);border-color:var(--border)}
.chip-g4.off:hover{background:var(--accent-lt);color:var(--accent);border-color:var(--accent)}

/* ── Meta row ─────────────────────────────────────────────────────────────── */
.meta{
  padding:9px 24px;display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--muted-soft);border-bottom:0.5px solid var(--hairline)
}
.meta-n{font-weight:600;color:var(--body)}
.meta-updated{margin-left:auto;font-size:12px}

/* ── Grid ─────────────────────────────────────────────────────────────────── */
.grid{
  padding:18px 24px 0;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
  gap:14px
}

/* ── Card ─────────────────────────────────────────────────────────────────── */
.card{
  display:flex;flex-direction:column;
  text-decoration:none;color:inherit;
  border:0.5px solid var(--hairline);border-radius:var(--radius);
  overflow:hidden;background:var(--surface-card);
  transition:transform .14s,box-shadow .14s,border-color .12s;
  position:relative;cursor:pointer
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(20,20,19,.09);
  border-color:var(--hairline-soft)
}
/* colored header */
.card-hd{
  padding:16px 16px 10px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px
}
.co-badge{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;flex-shrink:0;letter-spacing:.02em
}
.kpi-wrap{text-align:right}
.kpi-v{font-size:24px;font-weight:700;line-height:1;letter-spacing:-.03em}
.kpi-l{font-size:10px;opacity:.75;margin-top:3px;line-height:1.3}
/* body */
.card-body{padding:0 16px 10px;flex:1;display:flex;flex-direction:column;gap:3px}
.card-co{font-size:12px;color:var(--text3)}
.card-title{font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.card-desc{
  font-size:13px;color:var(--text2);line-height:1.55;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
/* footer */
.card-ft{
  padding:8px 16px;border-top:0.5px solid var(--hairline);
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:var(--surface-cream-strong);flex-shrink:0
}
.ft-left{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.cat-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0}
.cat-badge.g1{background:var(--blue-bg);color:var(--blue)}
.cat-badge.g2{background:var(--amber-bg);color:var(--amber)}
.cat-badge.g3{background:var(--green-bg);color:var(--green)}
.cat-badge.g4{background:var(--accent-lt);color:var(--accent)}
.tag-pill{font-size:10px;padding:2px 8px;border-radius:9999px;background:var(--surface-cream-strong);color:var(--muted);white-space:nowrap}
.card-src{font-size:12px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.card-ext{font-size:11px;font-weight:500;color:var(--blue);flex-shrink:0;white-space:nowrap}
/* ── Thumbnail ─────────────────────────────────────────────── */
.card-thumb{
  aspect-ratio:16/9;overflow:hidden;
  background:var(--bg2);flex-shrink:0;position:relative
}
.cb-logo{
  width:100%;height:100%;object-fit:contain;
  padding:18px 28px;background:#fff;
  animation:cbFadeIn .28s ease both
}
@keyframes cbFadeIn{from{opacity:0}to{opacity:1}}
@media(prefers-color-scheme:dark){.cb-logo{background:#F0EDE5}}

/* ── Tooltip ──────────────────────────────────────────────────────────────── */
.tt{
  position:fixed;z-index:999;width:284px;
  background:var(--surface-dark);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--on-dark);font-size:12px;line-height:1.7;
  padding:11px 14px 13px;border-radius:12px;
  pointer-events:none;opacity:0;
  transition:opacity .14s;
  box-shadow:0 12px 32px rgba(20,20,19,.25);
  border:0.5px solid rgba(255,255,255,.08)
}
.tt.show{opacity:1}
.tt-label{
  font-size:9px;font-weight:700;letter-spacing:.08em;
  color:var(--accent-teal);margin-bottom:6px;text-transform:uppercase
}

/* ── Card delete button ───────────────────────────────────────────────────── */
.card-del{
  position:absolute;top:8px;right:8px;z-index:3;
  width:24px;height:24px;border-radius:50%;
  background:rgba(20,20,19,.55);backdrop-filter:blur(4px);
  color:#fff;font-size:14px;line-height:1;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s, background .12s;
  flex-shrink:0
}
.card:hover .card-del{opacity:1}
.card-del:hover{background:rgba(198,69,69,.85)}
.card.processing{
  pointer-events:none;
  position:relative;
}
.card.processing::after{
  content:'';
  position:absolute;inset:0;
  background:rgba(250,249,245,.7);
  backdrop-filter:blur(2px);
  border-radius:var(--radius);
  z-index:4
}
.card-spinner{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:22px;height:22px;
  border:2.5px solid var(--hairline);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
  z-index:5;display:none
}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.card.processing .card-spinner{display:block}
.card.deleted{
  opacity:0;transform:scale(.96);
  transition:opacity .3s,transform .3s;
  pointer-events:none
}

/* ── Confirm overlay ──────────────────────────────────────────────────────── */
.confirm-bg{
  position:fixed;inset:0;background:rgba(20,20,19,.45);
  backdrop-filter:blur(5px);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px
}
.confirm-bg.open{display:flex}
.confirm-box{
  background:var(--surface-card);border-radius:14px;
  width:100%;max-width:360px;padding:26px 24px 20px;
  box-shadow:0 20px 56px rgba(20,20,19,.22);
  border:0.5px solid var(--hairline)
}
.confirm-icon{font-size:24px;margin-bottom:12px}
.confirm-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px}
.confirm-desc{
  font-size:13px;color:var(--body);line-height:1.6;margin-bottom:20px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.confirm-btns{display:flex;gap:8px;justify-content:flex-end}

/* ── Toast ────────────────────────────────────────────────────────────────── */
.arc-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface-dark);color:var(--on-dark);
  font-size:12px;padding:10px 18px;border-radius:9999px;
  opacity:0;transition:opacity .2s;pointer-events:none;
  white-space:nowrap;z-index:600;
  box-shadow:0 8px 24px rgba(20,20,19,.28);
  border:0.5px solid rgba(255,255,255,.08)
}
.arc-toast.show{opacity:1}


/* ── Empty / Loading ──────────────────────────────────────────────────────── */
.empty{
  grid-column:1/-1;padding:56px 0;text-align:center;
  font-size:13px;color:var(--text3)
}
.loading-row{
  display:flex;align-items:center;justify-content:center;
  height:38vh;font-size:13px;color:var(--text3)
}

/* ── Token notice banner ──────────────────────────────────────────────────── */
.token-notice{
  display:none;
  margin:10px 24px 0;padding:10px 14px;
  border-radius:8px;border:0.5px solid var(--g2-b);
  background:var(--g2-bg);font-size:12px;color:var(--g2);
  align-items:center;gap:10px;cursor:pointer
}
.token-notice.show{display:flex}
.token-notice:hover{opacity:.85}

/* ── Token inline input ───────────────────────────────────────────────────── */
.token-form{
  display:none;
  margin:10px 24px 0;padding:14px 16px;
  border-radius:8px;border:0.5px solid var(--hairline);
  background:var(--surface-card);
  align-items:center;gap:8px;flex-wrap:wrap
}
.token-form.show{display:flex}
.token-form input{
  flex:1;min-width:200px;padding:7px 10px;
  border:1px solid var(--hairline);border-radius:7px;
  background:var(--canvas);color:var(--ink);
  font-family:monospace;font-size:12px;outline:none;
  transition:border-color .12s
}
.token-form input:focus{border-color:var(--primary)}
.token-form-label{font-size:12px;color:var(--muted);white-space:nowrap}

@media(max-width:640px){
  .hd{padding:12px 16px}
  .hd-sub{display:none}
  .filters{padding:8px 16px;top:60px}
  .meta{padding:7px 16px}
  .grid{padding:14px 16px 0;gap:10px}
}
</style>
</head>
<body>

<!-- ── Page sub-header ───────────────────────────────────────────────────── -->
<header class="hd">
  <div class="hd-left">
    <span class="hd-title">AI 생활 변화 아티클</span>
    <span class="hd-sub" id="hd-sub">로딩 중...</span>
  </div>
</header>

<!-- ── Token notice (미설정 시 표시) ─────────────────────────────────────── -->
<div class="token-notice" id="token-notice" onclick="showTokenForm()">
  🔑 삭제 기능을 사용하려면 GitHub 토큰이 필요합니다 — 클릭해서 설정하세요
</div>
<div class="token-form" id="token-form">
  <span class="token-form-label">GitHub PAT</span>
  <input type="password" id="pat-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
         onkeydown="if(event.key==='Enter') savePAT()">
  <button class="btn btn-primary btn-sm" onclick="savePAT()">저장</button>
  <button class="btn btn-ghost btn-sm" onclick="hideTokenForm()">취소</button>
</div>

<!-- ── Filter bar ────────────────────────────────────────────────────────── -->
<div class="filters" id="filters">
  <span style="font-size:11px;color:var(--text3)">필터 로딩 중...</span>
</div>

<!-- ── Meta row ──────────────────────────────────────────────────────────── -->
<div class="meta">
  <span class="meta-n" id="meta-n">–</span>
  <span>개 아티클 표시 중</span>
  <span class="meta-updated" id="meta-updated"></span>
</div>

<!-- ── Card grid ─────────────────────────────────────────────────────────── -->
<main class="grid" id="grid">
  <div class="loading-row" style="grid-column:1/-1">데이터 불러오는 중...</div>
</main>

<!-- ── Tooltip ────────────────────────────────────────────────────────────── -->
<div class="tt" id="tt">
  <div class="tt-label">아티클 요약</div>
  <div id="tt-text"></div>
</div>

<!-- ── Delete confirm ────────────────────────────────────────────────────── -->
<div class="confirm-bg" id="confirm-bg">
  <div class="confirm-box">
    <div class="confirm-icon">🗑</div>
    <div class="confirm-title">아티클을 삭제할까요?</div>
    <div class="confirm-desc" id="confirm-desc"></div>
    <div class="confirm-btns">
      <button class="btn btn-ghost btn-sm" onclick="confirmNo()">취소</button>
      <button class="btn btn-danger btn-sm" onclick="confirmYes()">삭제</button>
    </div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────────────── -->
<div class="arc-toast" id="arc-toast"></div>

<script>
let DB = null;
let activeCat = 'all';

// ── Tooltip ───────────────────────────────────────────────────────────────────
const ttEl   = document.getElementById('tt');
const ttText = document.getElementById('tt-text');
const TT_W = 300, TT_H = 130;

document.addEventListener('mousemove', e => {
  const x = e.clientX + 16, y = e.clientY - 10;
  ttEl.style.left = (x + TT_W > window.innerWidth  ? e.clientX - TT_W - 10 : x) + 'px';
  ttEl.style.top  = (y + TT_H > window.innerHeight ? e.clientY - TT_H - 10 : y) + 'px';
});

function showTip(text) { ttText.textContent = text; ttEl.classList.add('show'); }
function hideTip()     { ttEl.classList.remove('show'); }

// ── Load data ─────────────────────────────────────────────────────────────────
async function load() {
  try {
    const res = await fetch('./data/cases.json');
    if (!res.ok) throw new Error(res.status);
    DB = await res.json();
    buildFilters();
    render('all');
    document.getElementById('hd-sub').textContent =
      `Life After AI · ${DB.meta.total_cases}개 아티클`;
    document.getElementById('meta-updated').textContent =
      '최종 갱신 ' + new Date(DB.meta.last_updated).toLocaleDateString('ko-KR');
  } catch(e) {
    document.getElementById('grid').innerHTML =
      '<div class="empty">데이터 로드 실패. articles.json을 확인하세요.</div>';
  }
}

// ── Build filter chips ────────────────────────────────────────────────────────
const GROUPS = {
  '1': { label: '생활 공간 변화', cls: 'g1' },
  '2': { label: '소비 행동 변화', cls: 'g2' },
  '3': { label: '개인 행동 변화', cls: 'g3' },
  '4': { label: '인간 관계 변화', cls: 'g4' },
};

function buildFilters() {
  const cats = DB.categories;

  let h = `<span class="chip chip-all" id="chip-all" onclick="selFilter('all')">전체 ${DB.cases.length}</span>`;

  Object.entries(GROUPS).forEach(([prefix, g]) => {
    const groupCats = Object.entries(cats).filter(([id]) => id.startsWith(prefix + '-'));
    if (!groupCats.length) return;
    h += `<div class="f-sep"></div><span class="f-label">${g.label}</span>`;
    groupCats.forEach(([id, cat]) => {
      const n = DB.cases.filter(c => c.category === id).length;
      h += `<span class="chip chip-${g.cls} off" id="chip-${id}" onclick="selFilter('${id}')">${id} · ${cat.name} <strong>${n}</strong></span>`;
    });
  });

  document.getElementById('filters').innerHTML = h;
}

// ── Filter select ─────────────────────────────────────────────────────────────
function selFilter(id) {
  document.querySelectorAll('.chip').forEach(el => el.classList.add('off'));
  const target = document.getElementById('chip-' + (id === 'all' ? 'all' : id));
  if (target) target.classList.remove('off');
  activeCat = id;
  render(id);
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(catId) {
  const list = (catId === 'all'
    ? [...DB.cases]
    : DB.cases.filter(c => c.category === catId)
  ).sort((a, b) => (b.published_date||b.added_date||'').localeCompare(a.published_date||a.added_date||''));

  document.getElementById('meta-n').textContent = list.length;

  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty">해당 카테고리에 아티클이 없습니다.</div>';
    return;
  }
  grid.innerHTML = '';
  list.forEach(c => grid.appendChild(makeCard(c)));
}

// ── Thumb helpers ──────────────────────────────────────────────────────────────
function lightenHex(hex, amt) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, (n >> 16) + amt);
  const g = Math.min(255, ((n >> 8) & 0xFF) + amt);
  const b = Math.min(255, (n & 0xFF) + amt);
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

function companyDomain(name) {
  return name.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/['''ʼ]/g, '')
    .replace(/\bthe\s+/g, '')
    .replace(/[^a-z0-9]/g, '')
    + '.com';
}

function svgThumb(c) {
  const uid = 'g' + c.id.replace(/[^a-z0-9]/gi, '');
  const bg2 = lightenHex(c.color_bg, 24);
  const tc  = c.color_text;
  const kv  = (c.kpi_value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const kl  = (c.kpi_label || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const sh  = (c.short     || '').replace(/&/g,'&amp;');
  const fs  = kv.length > 7 ? 34 : kv.length > 5 ? 42 : 50;
  const ky  = fs < 42 ? 92 : 96;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" style="display:block">
  <defs>
    <linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="${c.color_bg}"/>
      <stop offset="100%" stop-color="${bg2}"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#${uid})"/>
  <circle cx="290" cy="22"  r="58" fill="${tc}" opacity=".05"/>
  <circle cx="30"  cy="158" r="42" fill="${tc}" opacity=".05"/>
  <rect x="13" y="13" width="36" height="17" rx="4" fill="${tc}" opacity=".13"/>
  <text x="31" y="25.5" font-family="system-ui,sans-serif" font-size="9" font-weight="700"
    fill="${tc}" opacity=".72" text-anchor="middle" letter-spacing=".5">${c.category}</text>
  <text x="160" y="${ky}" font-family="system-ui,sans-serif" font-size="${fs}" font-weight="700"
    fill="${tc}" text-anchor="middle" letter-spacing="-1.5">${kv}</text>
  <text x="160" y="122" font-family="system-ui,sans-serif" font-size="11"
    fill="${tc}" opacity=".58" text-anchor="middle">${kl}</text>
  <rect x="13" y="149" width="30" height="17" rx="4" fill="${tc}" opacity=".14"/>
  <text x="28" y="161.5" font-family="system-ui,sans-serif" font-size="9" font-weight="700"
    fill="${tc}" opacity=".75" text-anchor="middle">${sh}</text>
</svg>`;
}

function buildThumb(c) {
  const wrap = document.createElement('div');
  wrap.className = 'card-thumb';
  wrap.innerHTML = svgThumb(c);                // SVG 즉시 표시

  const img = new Image();
  img.onload = () => {                         // Clearbit 성공 시 교체
    wrap.innerHTML = '';
    img.className = 'cb-logo';
    wrap.appendChild(img);
  };
  img.src = `https://logo.clearbit.com/${companyDomain(c.company)}?size=256`;
  return wrap;
}

// ── Make card ──────────────────────────────────────────────────────────────────
function makeCard(c) {
  const cat    = DB.categories[c.category] || {};
  const g = 'g' + (c.category.split('-')[0] || '1');
  const dateStr = (c.published_date || c.added_date)
    ? new Date(c.published_date || c.added_date).toLocaleDateString('ko-KR', {month:'short', day:'numeric'})
    : '';
  const tags = (c.tags || []).slice(0, 2)
    .map(t => `<span class="tag-pill">${t}</span>`).join('');
  const srcShort = (c.source || '').split(',')[0].trim();

  const a = document.createElement('a');
  a.className = 'card';
  a.id        = 'card-' + c.id;
  a.href      = c.url;
  a.target    = '_blank';
  a.rel       = 'noopener noreferrer';

  // 스피너 (처리 중 표시)
  const spinner = document.createElement('div');
  spinner.className = 'card-spinner';
  a.appendChild(spinner);

  // X 삭제 버튼
  const delBtn = document.createElement('button');
  delBtn.className   = 'card-del';
  delBtn.title       = '삭제';
  delBtn.textContent = '×';
  delBtn.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    askDelete(c);
  });
  a.appendChild(delBtn);

  a.appendChild(buildThumb(c));               // thumb (Clearbit or SVG)

  const body = document.createElement('div');
  body.className = 'card-body';
  body.innerHTML = `
    <div class="card-co">${c.company}</div>
    <div class="card-title">${c.title}</div>
    <div class="card-desc">${c.description}</div>`;
  a.appendChild(body);

  const ft = document.createElement('div');
  ft.className = 'card-ft';
  ft.innerHTML = `
    <div class="ft-left">
      <span class="cat-badge ${g}">${c.category}</span>
      ${tags}
    </div>
    <span class="card-src">${srcShort} · ${dateStr}</span>`;
  a.appendChild(ft);

  if (c.body) {
    a.addEventListener('mouseenter', () => showTip(c.body));
    a.addEventListener('mouseleave', hideTip);
  }
  return a;
}

load();

/* PAT — articles.html과 동일한 localStorage 키(gh_pat) 공유 */
const PAT_KEY = 'gh_pat';
const REPO    = 'skykelly/ai-future-blog';
function getPAT() { return localStorage.getItem(PAT_KEY) || ''; }

function updateTokenUI() {
  const hasToken = !!getPAT();
  document.getElementById('token-notice').classList.toggle('show', !hasToken);
  if (hasToken) hideTokenForm();
}
function showTokenForm() {
  document.getElementById('token-notice').classList.remove('show');
  document.getElementById('token-form').classList.add('show');
  setTimeout(() => document.getElementById('pat-input').focus(), 50);
}
function hideTokenForm() {
  document.getElementById('token-form').classList.remove('show');
  updateTokenUI();
}
function savePAT() {
  const v = document.getElementById('pat-input').value.trim();
  if (!v) return;
  localStorage.setItem(PAT_KEY, v);
  document.getElementById('pat-input').value = '';
  updateTokenUI();
  arcToast('✓ 토큰이 저장됐습니다');
}
updateTokenUI();

/* ══════════════════════════════════════════════════════════
   Toast
══════════════════════════════════════════════════════════ */
let _toastTimer = null;
function arcToast(msg) {
  const el = document.getElementById('arc-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ══════════════════════════════════════════════════════════
   Delete — confirm + GitHub API
══════════════════════════════════════════════════════════ */
let _pendingCase = null;

function askDelete(c) {
  _pendingCase = c;
  document.getElementById('confirm-desc').textContent =
    `[${c.category}] ${c.company} — ${c.title}`;
  document.getElementById('confirm-bg').classList.add('open');
}

function confirmNo() {
  _pendingCase = null;
  document.getElementById('confirm-bg').classList.remove('open');
}

async function confirmYes() {
  document.getElementById('confirm-bg').classList.remove('open');
  const c = _pendingCase; _pendingCase = null;
  if (!c) return;

  const token = getPAT();
  if (!token) { arcToast('❌ 토큰 미설정 — 페이지 상단 안내를 클릭하세요'); return; }

  const cardEl = document.getElementById('card-' + c.id);
  if (cardEl) cardEl.classList.add('processing');
  arcToast('삭제 중...');

  const ok = await deleteViaAPI([c.id], token);
  if (ok) {
    if (cardEl) { cardEl.classList.remove('processing'); cardEl.classList.add('deleted'); setTimeout(() => cardEl.remove(), 320); }
    const m = document.getElementById('meta-n');
    if (m) m.textContent = Math.max(0, parseInt(m.textContent || '0') - 1);
    arcToast('✓ 삭제 완료');
  } else {
    if (cardEl) cardEl.classList.remove('processing');
  }
}

async function deleteViaAPI(ids, token) {
  const paths = ['docs/data/cases.json'];
  try {
    for (const path of paths) {
      const metaRes = await fetch(
        `https://api.github.com/repos/${REPO}/contents/${path}`,
        { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } }
      );
      if (!metaRes.ok) throw new Error(`읽기 실패: ${path} (${metaRes.status})`);
      const meta = await metaRes.json();

      const db = JSON.parse(atob(meta.content.replace(/\s/g, '')));
      db.cases = db.cases.filter(c => !ids.includes(c.id));
      db.meta.total_cases  = db.cases.length;
      db.meta.last_updated = new Date().toISOString();

      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2))));
      const putRes = await fetch(
        `https://api.github.com/repos/${REPO}/contents/${path}`,
        {
          method: 'PUT',
          headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
          body: JSON.stringify({ message: `chore(articles): delete [${ids.join(',')}] [manual]`, content: encoded, sha: meta.sha, branch: 'main' }),
        }
      );
      if (!putRes.ok) {
        const err = await putRes.json().catch(() => ({}));
        throw new Error(err.message || `저장 실패 (${putRes.status})`);
      }
    }
    return true;
  } catch(e) {
    arcToast(`❌ ${e.message}`);
    return false;
  }
}
