<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 케이스 피드 — LGE AX 전략</title>
<style>
:root{
  --bg:#fff;--bg2:#f5f4f0;--bg3:#eceae3;
  --text:#1a1a18;--text2:#4a4a46;--text3:#888780;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.22);
  --green-bg:#E1F5EE;--green:#085041;--green-b:#5DCAA5;
  --amber-bg:#FAEEDA;--amber:#633806;--amber-b:#EF9F27;
  --blue-bg:#E6F1FB;--blue:#0C447C;--blue-b:#85B7EB;
  --radius:14px;--radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--bg2:#242420;--bg3:#2c2c28;
  --text:#e8e6df;--text2:#b0aea6;--text3:#6a6860;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.20);
  --green-bg:#085041;--green:#9FE1CB;--green-b:#1D9E75;
  --amber-bg:#633806;--amber:#FAC775;--amber-b:#BA7517;
  --blue-bg:#042C53;--blue:#85B7EB;--blue-b:#185FA5;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--font);color:var(--text);padding-bottom:64px}

/* ── Header ───────────────────────────────────────────────────────────────── */
.hd{
  padding:14px 24px;border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;background:var(--bg);z-index:20;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
.hd-left{display:flex;align-items:baseline;gap:10px;min-width:0}
.hd-title{font-size:15px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.hd-sub{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-link{
  font-size:12px;font-weight:500;color:var(--blue);text-decoration:none;
  padding:5px 11px;border:0.5px solid var(--blue-b);border-radius:7px;
  white-space:nowrap;transition:background .1s
}
.hd-link:hover{background:var(--blue-bg)}

/* ── Filter bar ────────────────────────────────────────────────────────────── */
.filters{
  padding:10px 24px;border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;gap:6px;overflow-x:auto;
  background:var(--bg);position:sticky;top:49px;z-index:19;
  scrollbar-width:none
}
.filters::-webkit-scrollbar{display:none}
.f-sep{width:0.5px;height:16px;background:var(--border2);flex-shrink:0;margin:0 2px}
.f-label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.04em;flex-shrink:0}
.chip{
  font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;
  cursor:pointer;flex-shrink:0;border:0.5px solid transparent;
  transition:all .12s;user-select:none;white-space:nowrap
}
/* all chip */
.chip-all{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip-all.off{background:transparent;color:var(--text2);border-color:var(--border2)}
.chip-all.off:hover{border-color:var(--text2)}
/* top chips */
.chip-t{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.chip-t.off{background:transparent;color:var(--text3);border-color:var(--border)}
.chip-t.off:hover{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
/* bot chips */
.chip-b{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-b)}
.chip-b.off{background:transparent;color:var(--text3);border-color:var(--border)}
.chip-b.off:hover{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-b)}

/* ── Meta row ─────────────────────────────────────────────────────────────── */
.meta{
  padding:8px 24px;display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text3);border-bottom:0.5px solid var(--border)
}
.meta-n{font-weight:600;color:var(--text2)}
.meta-updated{margin-left:auto;font-size:10px}

/* ── Grid ─────────────────────────────────────────────────────────────────── */
.grid{
  padding:18px 24px 0;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
  gap:14px
}

/* ── Card ─────────────────────────────────────────────────────────────────── */
.card{
  display:flex;flex-direction:column;
  text-decoration:none;color:inherit;
  border:0.5px solid var(--border);border-radius:var(--radius);
  overflow:hidden;background:var(--bg);
  transition:transform .14s,box-shadow .14s,border-color .12s;
  position:relative;cursor:pointer
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 28px rgba(0,0,0,.10);
  border-color:var(--border2)
}
/* colored header */
.card-hd{
  padding:16px 16px 10px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px
}
.co-badge{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;flex-shrink:0;letter-spacing:.02em
}
.kpi-wrap{text-align:right}
.kpi-v{font-size:24px;font-weight:700;line-height:1;letter-spacing:-.03em}
.kpi-l{font-size:10px;opacity:.75;margin-top:3px;line-height:1.3}
/* body */
.card-body{padding:0 16px 10px;flex:1;display:flex;flex-direction:column;gap:3px}
.card-co{font-size:11px;color:var(--text3)}
.card-title{font-size:14px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.card-desc{
  font-size:12px;color:var(--text2);line-height:1.55;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
/* footer */
.card-ft{
  padding:8px 16px;border-top:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:var(--bg2);flex-shrink:0
}
.ft-left{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.cat-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0}
.cat-badge.t{background:var(--green-bg);color:var(--green)}
.cat-badge.b{background:var(--amber-bg);color:var(--amber)}
.tag-pill{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg3);color:var(--text3);white-space:nowrap}
.card-src{font-size:10px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.card-ext{font-size:11px;font-weight:500;color:var(--blue);flex-shrink:0;white-space:nowrap}

/* ── Tooltip ──────────────────────────────────────────────────────────────── */
.tt{
  position:fixed;z-index:999;width:284px;
  background:rgba(22,22,20,.93);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#e8e6df;font-size:12px;line-height:1.7;
  padding:11px 14px 13px;border-radius:11px;
  pointer-events:none;opacity:0;
  transition:opacity .14s;
  box-shadow:0 8px 24px rgba(0,0,0,.30);
  border:0.5px solid rgba(255,255,255,.10)
}
.tt.show{opacity:1}
.tt-label{
  font-size:9px;font-weight:700;letter-spacing:.06em;
  color:#5DCAA5;margin-bottom:6px;text-transform:uppercase
}

/* ── Empty / Loading ──────────────────────────────────────────────────────── */
.empty{
  grid-column:1/-1;padding:56px 0;text-align:center;
  font-size:13px;color:var(--text3)
}
.loading-row{
  display:flex;align-items:center;justify-content:center;
  height:38vh;font-size:13px;color:var(--text3)
}

@media(max-width:640px){
  .hd{padding:12px 16px}
  .hd-sub{display:none}
  .filters{padding:8px 16px;top:45px}
  .meta{padding:7px 16px}
  .grid{padding:14px 16px 0;gap:10px}
}
</style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────────────────── -->
<header class="hd">
  <div class="hd-left">
    <span class="hd-title">AI 케이스 피드</span>
    <span class="hd-sub" id="hd-sub">로딩 중...</span>
  </div>
  <a class="hd-link" href="./index.html">← 대시보드</a>
</header>

<!-- ── Filter bar ────────────────────────────────────────────────────────── -->
<div class="filters" id="filters">
  <span style="font-size:11px;color:var(--text3)">필터 로딩 중...</span>
</div>

<!-- ── Meta row ──────────────────────────────────────────────────────────── -->
<div class="meta">
  <span class="meta-n" id="meta-n">–</span>
  <span>개 사례 표시 중</span>
  <span class="meta-updated" id="meta-updated"></span>
</div>

<!-- ── Card grid ─────────────────────────────────────────────────────────── -->
<main class="grid" id="grid">
  <div class="loading-row" style="grid-column:1/-1">데이터 불러오는 중...</div>
</main>

<!-- ── Tooltip ────────────────────────────────────────────────────────────── -->
<div class="tt" id="tt">
  <div class="tt-label">LLM 요약</div>
  <div id="tt-text"></div>
</div>

<script>
let DB = null;
let activeCat = 'all';

// ── Tooltip ───────────────────────────────────────────────────────────────────
const ttEl   = document.getElementById('tt');
const ttText = document.getElementById('tt-text');
const TT_W = 300, TT_H = 130;

document.addEventListener('mousemove', e => {
  const x = e.clientX + 16, y = e.clientY - 10;
  ttEl.style.left = (x + TT_W > window.innerWidth  ? e.clientX - TT_W - 10 : x) + 'px';
  ttEl.style.top  = (y + TT_H > window.innerHeight ? e.clientY - TT_H - 10 : y) + 'px';
});

function showTip(text) { ttText.textContent = text; ttEl.classList.add('show'); }
function hideTip()     { ttEl.classList.remove('show'); }

// ── Load data ─────────────────────────────────────────────────────────────────
async function load() {
  try {
    const res = await fetch('./data/cases.json');
    if (!res.ok) throw new Error(res.status);
    DB = await res.json();
    buildFilters();
    render('all');
    document.getElementById('hd-sub').textContent =
      `LGE AX 전략 · ${DB.meta.total_cases}개 사례`;
    document.getElementById('meta-updated').textContent =
      '최종 갱신 ' + new Date(DB.meta.last_updated).toLocaleDateString('ko-KR');
  } catch(e) {
    document.getElementById('grid').innerHTML =
      '<div class="empty">데이터 로드 실패. cases.json을 확인하세요.</div>';
  }
}

// ── Build filter chips ────────────────────────────────────────────────────────
function buildFilters() {
  const cats = DB.categories;
  const tops = Object.entries(cats).filter(([,v]) => v.type === 'top');
  const bots = Object.entries(cats).filter(([,v]) => v.type === 'bot');

  let h = `<span class="chip chip-all" id="chip-all" onclick="selFilter('all')">전체 ${DB.cases.length}</span>`;
  h += '<div class="f-sep"></div><span class="f-label">TOP-LINE</span>';
  tops.forEach(([id, cat]) => {
    const n = DB.cases.filter(c => c.category === id).length;
    h += `<span class="chip chip-t off" id="chip-${id}" onclick="selFilter('${id}')">${id} · ${cat.name} <strong>${n}</strong></span>`;
  });
  h += '<div class="f-sep"></div><span class="f-label">BOTTOM-LINE</span>';
  bots.forEach(([id, cat]) => {
    const n = DB.cases.filter(c => c.category === id).length;
    h += `<span class="chip chip-b off" id="chip-${id}" onclick="selFilter('${id}')">${id} · ${cat.name} <strong>${n}</strong></span>`;
  });
  document.getElementById('filters').innerHTML = h;
}

// ── Filter select ─────────────────────────────────────────────────────────────
function selFilter(id) {
  document.querySelectorAll('.chip').forEach(el => el.classList.add('off'));
  const target = document.getElementById('chip-' + (id === 'all' ? 'all' : id));
  if (target) target.classList.remove('off');
  activeCat = id;
  render(id);
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(catId) {
  const list = (catId === 'all'
    ? [...DB.cases]
    : DB.cases.filter(c => c.category === catId)
  ).sort((a, b) => b.added_date.localeCompare(a.added_date));

  document.getElementById('meta-n').textContent = list.length;

  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty">해당 카테고리에 사례가 없습니다.</div>';
    return;
  }
  grid.innerHTML = '';
  list.forEach(c => grid.appendChild(makeCard(c)));
}

// ── Make card ─────────────────────────────────────────────────────────────────
function makeCard(c) {
  const cat   = DB.categories[c.category] || {};
  const isTop = cat.type === 'top';
  const tt_cls = isTop ? 't' : 'b';
  const dateStr = c.added_date
    ? new Date(c.added_date).toLocaleDateString('ko-KR', {month:'short', day:'numeric'})
    : '';
  const tags = (c.tags || []).slice(0, 2)
    .map(t => `<span class="tag-pill">${t}</span>`).join('');
  const srcShort = (c.source || '').split(',')[0].trim();

  const a = document.createElement('a');
  a.className = 'card';
  a.href      = c.url;
  a.target    = '_blank';
  a.rel       = 'noopener noreferrer';
  a.innerHTML = `
    <div class="card-hd" style="background:${c.color_bg}1a">
      <div class="co-badge" style="background:${c.color_bg};color:${c.color_text}">${c.short}</div>
      <div class="kpi-wrap" style="color:${c.color_text}">
        <div class="kpi-v">${c.kpi_value}</div>
        <div class="kpi-l">${c.kpi_label}</div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-co">${c.company}</div>
      <div class="card-title">${c.title}</div>
      <div class="card-desc">${c.description}</div>
    </div>
    <div class="card-ft">
      <div class="ft-left">
        <span class="cat-badge ${tt_cls}">${c.category}</span>
        ${tags}
      </div>
      <span class="card-src">${srcShort} · ${dateStr}</span>
    </div>`;

  if (c.body) {
    a.addEventListener('mouseenter', () => showTip(c.body));
    a.addEventListener('mouseleave', hideTip);
  }
  return a;
}

load();
</script>
</body>
</html>
