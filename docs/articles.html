<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아티클 관리 — Life After AI</title>
<link rel="stylesheet" href="./shared.css">
<style>
body { padding-bottom: 80px; font-size: 14px; }

/* ── Sub-header ───────────────────────────────────────────── */
.hd {
  padding: 13px 24px;
  border-bottom: 0.5px solid var(--hairline);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  position: sticky; top: 64px; background: var(--canvas); z-index: 30;
  backdrop-filter: blur(12px);
}
.hd-title {
  font-family: var(--font-display); font-size: 18px; font-weight: 400;
  letter-spacing: -0.02em; color: var(--ink);
}

/* ── Tabs ─────────────────────────────────────────────────── */
.tabs {
  padding: 0 24px; border-bottom: 0.5px solid var(--hairline);
  display: flex; background: var(--canvas);
}
.tab {
  font-size: 13px; font-weight: 500; padding: 11px 18px; cursor: pointer;
  border-bottom: 2px solid transparent; color: var(--muted);
  transition: all .12s; user-select: none;
}
.tab:hover { color: var(--ink); }
.tab.on    { color: var(--ink); border-bottom-color: var(--primary); }

/* ── Panel ────────────────────────────────────────────────── */
.panel { display: none; padding: 20px 24px; max-width: 760px; }
.panel.on { display: block; }

/* ── Add form ─────────────────────────────────────────────── */
.form-card {
  background: var(--surface-card);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
}
.form-card label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--muted); letter-spacing: .05em; text-transform: uppercase;
  margin-bottom: 6px;
}
.url-row { display: flex; gap: 8px; margin-bottom: 16px; }
.url-row input {
  flex: 1; padding: 9px 12px;
  border: 1px solid var(--hairline); border-radius: 8px;
  background: var(--canvas); color: var(--ink);
  font-family: var(--font); font-size: 13px; outline: none;
  transition: border-color .12s;
}
.url-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(204,120,92,.12); }
.cat-select {
  width: 100%; padding: 8px 12px;
  border: 1px solid var(--hairline); border-radius: 8px;
  background: var(--canvas); color: var(--ink);
  font-family: var(--font); font-size: 13px; outline: none;
  transition: border-color .12s; margin-bottom: 18px;
}
.cat-select:focus { border-color: var(--primary); }

/* ── Command block ────────────────────────────────────────── */
.cmd-wrap {
  display: none;
  background: var(--surface-dark);
  border-radius: 10px;
  padding: 16px 16px 14px;
  margin-top: 4px;
}
.cmd-wrap.show { display: block; }
.cmd-label {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--accent-teal);
  margin-bottom: 8px;
}
.cmd-text {
  font-family: "JetBrains Mono", "SFMono-Regular", monospace;
  font-size: 12px; line-height: 1.7; color: var(--on-dark);
  white-space: pre-wrap; word-break: break-all;
  margin-bottom: 12px;
}
.cmd-actions { display: flex; gap: 8px; align-items: center; }
.btn-copy {
  font-size: 12px; font-weight: 500; padding: 5px 14px;
  border-radius: 6px; border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.08); color: var(--on-dark);
  cursor: pointer; transition: all .12s;
}
.btn-copy:hover { background: rgba(255,255,255,.16); }
.btn-copy.copied { color: var(--accent-teal); border-color: var(--accent-teal); }
.cmd-hint {
  font-size: 11px; color: var(--on-dark-soft);
  margin-left: 4px;
}

/* ── Manage panel ─────────────────────────────────────────── */
#panel-manage { max-width: 100%; }

.filter-row {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 12px 24px 12px; align-items: center;
  border-bottom: 0.5px solid var(--hairline);
  background: var(--canvas);
  position: sticky; top: 125px; z-index: 19;
}
.chip {
  font-size: 12px; font-weight: 500; padding: 5px 13px;
  border-radius: 9999px; cursor: pointer;
  border: 0.5px solid var(--hairline);
  background: transparent; color: var(--muted);
  transition: all .12s; user-select: none;
}
.chip:hover { background: var(--surface-card); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
.search-input {
  margin-left: auto; padding: 6px 12px; width: 180px;
  border: 1px solid var(--hairline); border-radius: 8px;
  background: var(--canvas); color: var(--ink);
  font-family: var(--font); font-size: 12px; outline: none;
}
.search-input:focus { border-color: var(--primary); }

.meta-bar {
  padding: 8px 24px; font-size: 12px; color: var(--muted-soft);
  border-bottom: 0.5px solid var(--hairline);
  display: flex; align-items: center; gap: 8px;
}
.sel-badge {
  font-size: 11px; font-weight: 600; color: var(--g4);
  background: var(--g4-bg); padding: 2px 8px; border-radius: 9999px;
  display: none;
}
.sel-badge.on { display: inline-block; }

.tbl-wrap { padding: 0 24px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th {
  font-size: 11px; font-weight: 600; color: var(--muted);
  letter-spacing: .05em; text-transform: uppercase;
  padding: 0 10px 8px; text-align: left;
  border-bottom: 0.5px solid var(--hairline);
}
td { padding: 10px; border-bottom: 0.5px solid var(--hairline); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface-card); }
tr.selected td { background: var(--g4-bg); }

.badge {
  font-size: 10px; font-weight: 700; padding: 2px 7px;
  border-radius: 9999px; white-space: nowrap;
}
.g1 { background: var(--g1-bg); color: var(--g1); }
.g2 { background: var(--g2-bg); color: var(--g2); }
.g3 { background: var(--g3-bg); color: var(--g3); }
.g4 { background: var(--g4-bg); color: var(--g4); }

.td-title { font-weight: 500; font-size: 13px; color: var(--ink); max-width: 240px; }
.td-title a { color: inherit; text-decoration: none; }
.td-title a:hover { color: var(--primary); }
.td-co   { font-size: 12px; color: var(--muted-soft); }
.td-date { font-size: 12px; color: var(--muted-soft); white-space: nowrap; }

/* row checkbox */
.row-check { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

/* ── Bottom delete command bar ────────────────────────────── */
.del-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 0 24px 16px;
  background: color-mix(in srgb, var(--canvas) 96%, transparent);
  backdrop-filter: blur(16px);
  border-top: 0.5px solid var(--hairline);
  z-index: 40;
  display: none;
}
.del-bar.show { display: block; }
.del-bar-inner {
  background: var(--surface-dark);
  border-radius: 12px;
  padding: 14px 16px 12px;
  margin-top: 12px;
}
.del-bar-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.del-bar-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-teal); }
.del-bar-close { font-size: 18px; color: var(--on-dark-soft); cursor: pointer; line-height: 1; }
.del-bar-close:hover { color: var(--on-dark); }

@media(max-width:640px){
  .hd { padding: 11px 16px; }
  .panel { padding: 16px; }
  .filter-row { padding: 8px 16px; }
  .tbl-wrap { padding: 0 16px; }
  .meta-bar { padding: 7px 16px; }
}
</style>
</head>
<body>

<header class="hd">
  <span class="hd-title">아티클 관리</span>
  <a href="https://github.com/skykelly/ai-future-blog/actions"
     target="_blank" rel="noopener"
     class="btn btn-outline btn-sm">GitHub Actions ↗</a>
</header>

<div class="tabs">
  <div class="tab on" id="tab-add"    onclick="selTab('add')">URL로 추가</div>
  <div class="tab"    id="tab-manage" onclick="selTab('manage')">아티클 목록</div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     Tab 1 — URL로 추가
═══════════════════════════════════════════════════════════ -->
<div class="panel on" id="panel-add">

  <div class="form-card">
    <label>아티클 URL</label>
    <div class="url-row">
      <input type="url" id="url-input" placeholder="https://example.com/article"
             oninput="clearAddCmd()" onkeydown="if(event.key==='Enter') genAddCmd()">
      <button class="btn btn-primary" onclick="genAddCmd()">명령어 생성</button>
    </div>

    <label>카테고리 힌트 <span style="font-weight:400;color:var(--muted-soft)">(선택 — 없으면 AI 자동 분류)</span></label>
    <select class="cat-select" id="cat-hint" oninput="clearAddCmd()">
      <option value="">-- 자동 감지 --</option>
      <optgroup label="생활 공간 변화">
        <option value="1-1">1-1 AI Home</option>
        <option value="1-2">1-2 Wellness Home</option>
        <option value="1-3">1-3 Energy Optimization</option>
      </optgroup>
      <optgroup label="소비 행동 변화">
        <option value="2-1">2-1 Agentic Commerce</option>
        <option value="2-2">2-2 AI Shopping</option>
        <option value="2-3">2-3 Subscription AI</option>
      </optgroup>
      <optgroup label="개인 행동 변화">
        <option value="3-1">3-1 AI Assistant</option>
        <option value="3-2">3-2 Productivity Life</option>
        <option value="3-3">3-3 Capability Divide</option>
      </optgroup>
      <optgroup label="인간 관계 변화">
        <option value="4-1">4-1 Emotional AI</option>
        <option value="4-2">4-2 Companion</option>
        <option value="4-3">4-3 Aging Society</option>
      </optgroup>
    </select>

    <!-- Generated command -->
    <div class="cmd-wrap" id="add-cmd-wrap">
      <div class="cmd-label">터미널 명령어</div>
      <div class="cmd-text" id="add-cmd-text"></div>
      <div class="cmd-actions">
        <button class="btn-copy" id="add-copy-btn" onclick="copyCmd('add-cmd-text','add-copy-btn')">복사</button>
        <span class="cmd-hint">Claude Code 터미널에서 <code style="color:var(--accent-teal)">!</code> 를 붙여 실행</span>
      </div>
    </div>
  </div>

  <p style="font-size:12px;color:var(--muted-soft);line-height:1.8">
    명령어 복사 → Claude Code 채팅창에 <code>! 명령어</code> 형태로 붙여넣어 실행<br>
    또는 터미널에서 직접 실행 · GitHub Actions 페이지에서 수동 실행도 가능합니다.
  </p>
</div>

<!-- ═══════════════════════════════════════════════════════════
     Tab 2 — 아티클 목록
═══════════════════════════════════════════════════════════ -->
<div class="panel" id="panel-manage">

  <div class="filter-row" id="filter-row">
    <span class="chip on" data-cat="all" onclick="filterCat('all')">전체</span>
    <span class="chip" data-cat="1" onclick="filterCat('1')">생활 공간</span>
    <span class="chip" data-cat="2" onclick="filterCat('2')">소비 행동</span>
    <span class="chip" data-cat="3" onclick="filterCat('3')">개인 행동</span>
    <span class="chip" data-cat="4" onclick="filterCat('4')">인간 관계</span>
    <input class="search-input" id="search-input" placeholder="검색..."
           oninput="renderTable()">
  </div>

  <div class="meta-bar">
    <span id="meta-count">–</span>개 표시 중
    <span class="sel-badge" id="sel-badge">0개 선택됨</span>
    <span id="meta-updated" style="margin-left:auto;font-size:11px"></span>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:30px">
            <input type="checkbox" class="row-check" id="check-all"
                   onchange="toggleAll(this.checked)" title="전체 선택">
          </th>
          <th style="width:80px">카테고리</th>
          <th style="width:100px">기업</th>
          <th>제목</th>
          <th style="width:80px">추가일</th>
        </tr>
      </thead>
      <tbody id="tbl-body">
        <tr><td colspan="5" style="padding:40px;text-align:center;color:var(--muted-soft)">불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── Delete command bar (sticky bottom) ──────────────────── -->
<div class="del-bar" id="del-bar">
  <div class="del-bar-inner">
    <div class="del-bar-head">
      <span class="del-bar-label" id="del-bar-label">삭제 명령어</span>
      <span class="del-bar-close" onclick="clearSelection()">×</span>
    </div>
    <div class="cmd-text" id="del-cmd-text" style="margin-bottom:10px"></div>
    <div class="cmd-actions">
      <button class="btn-copy" id="del-copy-btn" onclick="copyCmd('del-cmd-text','del-copy-btn')">복사</button>
      <span class="cmd-hint">Claude Code 터미널에서 <code style="color:var(--accent-teal)">!</code> 를 붙여 실행</span>
    </div>
  </div>
</div>

<script src="./nav.js"></script>
<script>
const REPO    = 'skykelly/ai-future-blog';
const CAT_MAP = {
  '1-1':'AI Home','1-2':'Wellness Home','1-3':'Energy Optimization',
  '2-1':'Agentic Commerce','2-2':'AI Shopping','2-3':'Subscription AI',
  '3-1':'AI Assistant','3-2':'Productivity Life','3-3':'Capability Divide',
  '4-1':'Emotional AI','4-2':'Companion','4-3':'Aging Society',
};

let DB         = null;
let activeCat  = 'all';
let selectedIds = new Set();

/* ─── Init ─────────────────────────────────────────────────── */
loadDB();

/* ─── Tabs ──────────────────────────────────────────────────── */
function selTab(name) {
  ['add','manage'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('on', t===name);
    document.getElementById('panel-'+t).classList.toggle('on', t===name);
  });
}

/* ─── Load DB ───────────────────────────────────────────────── */
async function loadDB() {
  try {
    const res = await fetch('./data/cases.json?t=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    DB = await res.json();
    document.getElementById('meta-updated').textContent =
      '최종 갱신 ' + new Date(DB.meta.last_updated).toLocaleDateString('ko-KR');
    renderTable();
  } catch {
    document.getElementById('tbl-body').innerHTML =
      `<tr><td colspan="5" style="padding:40px;text-align:center;color:var(--muted-soft)">
         cases.json 로드 실패 — HTTP 서버로 접근하세요
       </td></tr>`;
  }
}

/* ─── Filter & render ───────────────────────────────────────── */
function filterCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.chip[data-cat]').forEach(c =>
    c.classList.toggle('on', c.dataset.cat === cat));
  selectedIds.clear();
  renderTable();
  updateDelBar();
}

function renderTable() {
  if (!DB) return;
  const q = (document.getElementById('search-input').value || '').toLowerCase();
  const list = DB.cases.filter(c => {
    const catOk = activeCat === 'all' || c.category.startsWith(activeCat + '-');
    const qOk   = !q || [c.company, c.title, c.category, c.url]
      .some(s => (s||'').toLowerCase().includes(q));
    return catOk && qOk;
  }).sort((a, b) => (b.added_date||'').localeCompare(a.added_date||''));

  document.getElementById('meta-count').textContent = list.length;

  const tbody = document.getElementById('tbl-body');
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="padding:32px;text-align:center;color:var(--muted-soft)">아티클이 없습니다.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(c => {
    const g      = 'g' + (c.category.split('-')[0] || '1');
    const sel    = selectedIds.has(c.id);
    const date   = c.added_date
      ? new Date(c.added_date).toLocaleDateString('ko-KR', {month:'short', day:'numeric'})
      : '';
    return `<tr id="row-${esc(c.id)}" class="${sel ? 'selected' : ''}">
      <td><input type="checkbox" class="row-check" ${sel ? 'checked' : ''}
            onchange="toggleRow('${esc(c.id)}', this.checked)"></td>
      <td>
        <span class="badge ${g}">${c.category}</span>
        <div style="font-size:10px;color:var(--muted-soft);margin-top:2px">${CAT_MAP[c.category]||''}</div>
      </td>
      <td class="td-co">${esc(c.company)}</td>
      <td class="td-title">
        <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
      </td>
      <td class="td-date">${date}</td>
    </tr>`;
  }).join('');
}

/* ─── Selection ─────────────────────────────────────────────── */
function toggleRow(id, checked) {
  checked ? selectedIds.add(id) : selectedIds.delete(id);
  const row = document.getElementById('row-' + id);
  if (row) row.className = checked ? 'selected' : '';
  updateDelBar();
}

function toggleAll(checked) {
  if (!DB) return;
  const visible = getVisibleIds();
  visible.forEach(id => checked ? selectedIds.add(id) : selectedIds.delete(id));
  renderTable();
  updateDelBar();
}

function getVisibleIds() {
  const q = (document.getElementById('search-input').value || '').toLowerCase();
  return DB.cases
    .filter(c => {
      const catOk = activeCat === 'all' || c.category.startsWith(activeCat + '-');
      const qOk   = !q || [c.company,c.title,c.category].some(s=>(s||'').toLowerCase().includes(q));
      return catOk && qOk;
    })
    .map(c => c.id);
}

function clearSelection() {
  selectedIds.clear();
  document.getElementById('check-all').checked = false;
  renderTable();
  updateDelBar();
}

/* ─── Delete command bar ────────────────────────────────────── */
function updateDelBar() {
  const n   = selectedIds.size;
  const bar = document.getElementById('del-bar');
  const badge = document.getElementById('sel-badge');

  badge.textContent = `${n}개 선택됨`;
  badge.className   = 'sel-badge' + (n > 0 ? ' on' : '');

  if (n === 0) { bar.classList.remove('show'); return; }

  const ids = [...selectedIds].join(',');
  const cmd = `gh workflow run delete_articles.yml --repo ${REPO} -f ids="${ids}"`;
  document.getElementById('del-cmd-text').textContent = cmd;
  document.getElementById('del-bar-label').textContent = `${n}개 삭제 명령어`;
  bar.classList.add('show');
}

/* ─── Add command generator ─────────────────────────────────── */
function genAddCmd() {
  const url  = document.getElementById('url-input').value.trim();
  const hint = document.getElementById('cat-hint').value;
  if (!url || !url.startsWith('http')) {
    document.getElementById('url-input').focus();
    return;
  }
  const hintPart = hint ? ` \\\n  -f category_hint="${hint}"` : '';
  const cmd = `gh workflow run add_article.yml --repo ${REPO} \\\n  -f url="${url}"${hintPart}`;
  document.getElementById('add-cmd-text').textContent = cmd;
  document.getElementById('add-cmd-wrap').classList.add('show');
  document.getElementById('add-copy-btn').textContent = '복사';
  document.getElementById('add-copy-btn').classList.remove('copied');
}

function clearAddCmd() {
  document.getElementById('add-cmd-wrap').classList.remove('show');
}

/* ─── Copy to clipboard ─────────────────────────────────────── */
function copyCmd(textElId, btnId) {
  const text = document.getElementById(textElId).textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(btnId);
    btn.textContent = '복사됨 ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 2000);
  });
}

/* ─── Helpers ───────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
