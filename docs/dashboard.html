<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리서치 맵 — Life After AI</title>
<link rel="stylesheet" href="./shared.css">
<style>
body { padding: 20px 20px 48px; }

/* ── Page header ──────────────────────────────────────────── */
.page-hd {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 4px;
}
.page-title   { font-family: var(--font-display); font-size: 22px; font-weight: 400; letter-spacing: -0.02em; color: var(--ink); }
.last-updated { font-size: 12px; color: var(--muted-soft); }
.page-sub     { font-size: 13px; color: var(--muted-soft); margin-bottom: 18px; }

/* ── DB panel ─────────────────────────────────────────────── */
.db {
  display: flex;
  border: 0.5px solid var(--hairline);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--canvas);
  min-height: 640px;
}

/* ── Category sidebar (.db-nav) ───────────────────────────── */
.db-nav {
  width: 280px;
  flex-shrink: 0;
  background: var(--surface-soft);
  border-right: 0.5px solid var(--hairline);
  padding: 10px 0 20px;
  overflow-y: auto;
}
.db-nav-sec {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  padding: 20px 16px 7px;
  letter-spacing: -0.01em;
}
.db-nav-item {
  padding: 9px 16px;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: background var(--t-fast);
}
.db-nav-item:hover       { background: var(--surface-cream-strong); }
.db-nav-item.act-g1 { background: var(--blue-bg); }
.db-nav-item.act-g2 { background: var(--amber-bg); }
.db-nav-item.act-g3 { background: var(--green-bg); }
.db-nav-item.act-g4 { background: var(--accent-lt); }
.db-nav-pill {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 7px;
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 2px;
}
.db-nav-pill.g1 { background: var(--blue-bg);   color: var(--blue); }
.db-nav-pill.g2 { background: var(--amber-bg);  color: var(--amber); }
.db-nav-pill.g3 { background: var(--green-bg);  color: var(--green); }
.db-nav-pill.g4 { background: var(--accent-lt); color: var(--accent); }
.act-g1 .db-nav-pill.g1,
.act-g2 .db-nav-pill.g2,
.act-g3 .db-nav-pill.g3,
.act-g4 .db-nav-pill.g4 { background: rgba(255,255,255,.55); }
.db-nav-lbl         { font-size: 15px; color: var(--body); line-height: 1.35; }
.act-g1 .db-nav-lbl { color: var(--blue);   font-weight: 600; }
.act-g2 .db-nav-lbl { color: var(--amber);  font-weight: 600; }
.act-g3 .db-nav-lbl { color: var(--green);  font-weight: 600; }
.act-g4 .db-nav-lbl { color: var(--accent); font-weight: 600; }

/* ── Center panel ─────────────────────────────────────────── */
.center   { flex: 1; padding: 16px; min-width: 0; }
.ch       { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.ch-title { font-family: var(--font-display); font-size: 20px; font-weight: 400; letter-spacing: -0.02em; color: var(--ink); }
.ch-count {
  font-size: 12px;
  padding: 2px 9px;
  border-radius: 10px;
  font-weight: 500;
}
.ch-count.g1 { background: var(--blue-bg);   color: var(--blue); }
.ch-count.g2 { background: var(--amber-bg);  color: var(--amber); }
.ch-count.g3 { background: var(--green-bg);  color: var(--green); }
.ch-count.g4 { background: var(--accent-lt); color: var(--accent); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

/* ── Case card ────────────────────────────────────────────── */
.card {
  border: 0.5px solid var(--hairline);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  background: var(--surface-card);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.card:hover   { border-color: var(--hairline-soft); box-shadow: 0 4px 16px rgba(20,20,19,.08); }
.card.sel     { border: 1.5px solid var(--blue-b); background: var(--blue-bg); }
.card-top {
  padding: 13px 15px 9px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.co-circle {
  width: 38px; height: 38px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  flex-shrink: 0;
}
.card-kpi    { text-align: right; }
.kpi-val     { font-size: 22px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.kpi-lbl     { font-size: 11px; opacity: .75; margin-top: 3px; }
.card-body   { padding: 0 15px 11px; }
.card-co     { font-size: 12px; color: var(--text3); margin-bottom: 3px; }
.card-ttl    { font-size: 14px; font-weight: 600; line-height: 1.35; margin-bottom: 5px; }
.card-desc   { font-size: 13px; color: var(--text2); line-height: 1.55; }
.card-ft {
  padding: 8px 15px;
  border-top: 0.5px solid var(--hairline);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface-cream-strong);
}
.card-tag    { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.card-tag.g1 { background: var(--blue-bg);   color: var(--blue); }
.card-tag.g2 { background: var(--amber-bg);  color: var(--amber); }
.card-tag.g3 { background: var(--green-bg);  color: var(--green); }
.card-tag.g4 { background: var(--accent-lt); color: var(--accent); }
.card-new    { font-size: 9px; font-weight: 600; padding: 1px 6px; border-radius: 3px; background: #FFF3CD; color: #856404; margin-left: 5px; }
.card-see    { font-size: 12px; color: var(--blue); font-weight: 500; }

/* ── Detail panel ─────────────────────────────────────────── */
.det { width: 0; flex-shrink: 0; border-left: 0.5px solid var(--hairline); overflow: hidden; transition: width .22s; background: var(--surface-soft); }
.det.open   { width: clamp(260px, 33vw, 520px); }
.det-in     { width: clamp(260px, 33vw, 520px); padding: 18px; }
.det-hd     { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 0.5px solid var(--hairline); }
.det-co     { display: flex; align-items: center; gap: 10px; }
.det-badge  { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.det-co-name { font-size: 15px; font-weight: 600; color: var(--ink); }
.det-co-cat  { font-size: 12px; color: var(--muted-soft); margin-top: 2px; }
.det-close   { font-size: 20px; color: var(--muted-soft); cursor: pointer; padding: 2px 4px; line-height: 1; user-select: none; }
.det-close:hover { color: var(--ink); }
.det-tag     { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 9999px; margin-bottom: 12px; }
.det-tag.g1  { background: var(--blue-bg);   color: var(--blue); }
.det-tag.g2  { background: var(--amber-bg);  color: var(--amber); }
.det-tag.g3  { background: var(--green-bg);  color: var(--green); }
.det-tag.g4  { background: var(--accent-lt); color: var(--accent); }
.det-unverified { font-size: 11px; color: var(--g2); background: var(--g2-bg); padding: 3px 9px; border-radius: 9999px; display: inline-block; margin-bottom: 10px; }
.det-ttl     { font-family: var(--font-display); font-size: 17px; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 10px; line-height: 1.35; color: var(--ink); }
.det-body    { font-size: 13px; color: var(--body); line-height: 1.75; margin-bottom: 16px; }
.det-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.met         { background: var(--surface-cream-strong); border-radius: var(--radius-sm); padding: 11px 11px 9px; }
.met-v       { font-size: 20px; font-weight: 600; }
.met-v.pos   { color: var(--g3); }
.met-v.neg   { color: var(--error); }
.met-v.neu   { color: var(--muted); }
.met-l       { font-size: 11px; color: var(--muted-soft); margin-top: 3px; line-height: 1.3; }
.det-src a   { font-size: 12px; color: var(--primary); text-decoration: none; border-bottom: 0.5px solid rgba(204,120,92,.35); }
.det-src a:hover { color: var(--primary-active); }
.det-tags    { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
.det-tag-pill { font-size: 11px; padding: 3px 8px; border-radius: 9999px; background: var(--surface-cream-strong); color: var(--muted); }

/* ── Category insight block ────────────────────────────────── */
.cat-insight {
  position: relative;
  background: var(--surface-soft);
  border-radius: 10px;
  padding: 14px 16px 14px 20px;
  margin: 10px 0 20px;
  overflow: hidden;
}
.cat-insight::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--primary);
  border-radius: 3px 0 0 3px;
}
.cat-insight p {
  font-family: var(--font);
  font-size: 16px;
  font-weight: 500;
  line-height: 1.55;
  color: var(--ink);
  letter-spacing: 0;
  margin: 0;
}
.cat-insight p strong {
  font-family: inherit;
  font-size: inherit;
  font-weight: inherit;
  color: var(--primary);
}

.loading { display: flex; align-items: center; justify-content: center; height: 400px; font-size: 14px; color: var(--text3); }

@media (max-width: 960px) {
  .db             { flex-direction: column; }
  .db-nav         { width: 100%; border-right: none; border-bottom: 0.5px solid var(--hairline); display: flex; overflow-x: auto; padding: 8px; gap: 4px; }
  .db-nav-sec     { display: none; }
  .db-nav-item    { flex-shrink: 0; border-radius: 8px; padding: 7px 13px; }
  .det.open       { width: 100%; border-left: none; border-top: 0.5px solid var(--hairline); }
  .det-in         { width: 100%; }
  .cards          { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="page-hd">
  <span class="page-title">AI 생활 변화 리서치 맵</span>
  <span class="last-updated" id="last-updated">로딩 중...</span>
</div>
<div class="page-sub">4개 영역 · 12개 카테고리 | 카테고리 선택 → 카드 클릭 → 상세 출처 확인</div>

<div class="db">
  <div class="db-nav" id="db-nav"></div>
  <div class="center" id="center"><div class="loading">데이터 불러오는 중...</div></div>
  <div class="det" id="det"><div class="det-in" id="det-in"></div></div>
</div>

<script>
let DB = null;
let activeCat = null;
let activeCard = null;

async function loadData() {
  try {
    const res = await fetch('./data/cases.json');
    DB = await res.json();
    document.getElementById('last-updated').textContent =
      'Updated: ' + new Date(DB.meta.last_updated).toLocaleDateString('ko-KR') +
      ` (${DB.meta.total_cases}개 아티클)`;
    buildNav();
    selCat(Object.keys(DB.categories)[0]);
  } catch(e) {
    document.getElementById('center').innerHTML =
      '<div class="loading">데이터 로드 실패. cases.json을 확인하세요.</div>';
  }
}

const GROUPS = {
  '1': '생활 공간 변화',
  '2': '소비 행동 변화',
  '3': '개인 행동 변화',
  '4': '인간 관계 변화',
};

function catGroupNum(id) { return id.split('-')[0]; }
function catGroupCls(id) { return 'g' + catGroupNum(id); }

function buildNav() {
  const nav = document.getElementById('db-nav');
  const cats = DB.categories;
  let h = '';
  let first = true;

  Object.entries(GROUPS).forEach(([prefix, label]) => {
    const groupCats = Object.entries(cats).filter(([id]) => id.startsWith(prefix + '-'));
    if (!groupCats.length) return;
    if (!first) h += '<div style="height:0.5px;background:var(--border);margin:8px 0"></div>';
    first = false;
    h += `<div class="db-nav-sec">${label}</div>`;
    groupCats.forEach(([id, cat]) => {
      const count = DB.cases.filter(c => c.category === id).length;
      h += `<div class="db-nav-item" id="nav-${id}" onclick="selCat('${id}')">
        <span class="db-nav-pill g${prefix}">${id}</span>
        <span class="db-nav-lbl">${cat.name} <span style="font-size:11px;opacity:.55">${count}</span></span>
      </div>`;
    });
  });
  nav.innerHTML = h;
}

function selCat(id) {
  if (activeCat) {
    const p = document.getElementById('nav-' + activeCat);
    if (p) p.classList.remove('act-g1', 'act-g2', 'act-g3', 'act-g4');
  }
  activeCat = id;
  const cat = DB.categories[id];
  const g = catGroupCls(id);
  const el = document.getElementById('nav-' + id);
  if (el) el.classList.add('act-' + g);

  activeCard = null;
  document.getElementById('det').classList.remove('open');

  const cases = DB.cases
    .filter(c => c.category === id)
    .sort((a,b) => (b.published_date||b.added_date||'').localeCompare(a.published_date||a.added_date||''));

  const insightHtml = cat.insight
    ? `<div class="cat-insight"><p>${cat.insight.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')}</p></div>`
    : `<div style="font-size:13px;color:var(--muted-soft);margin-top:6px;margin-bottom:16px">${cat.sub || ''}</div>`;

  let h = `<div class="ch">
    <span class="ch-title">${cat.name}</span>
    <span class="ch-count ${g}">${id} · ${cases.length}개 아티클</span>
  </div>
  ${insightHtml}
  <div class="cards">`;

  cases.forEach((c, i) => {
    const isNew = !c.verified;
    h += `<div class="card" id="card-${id}-${i}" onclick="selCard('${id}',${i})">
      <div class="card-top" style="background:${c.color_bg}22">
        <div class="co-circle" style="background:${c.color_bg};color:${c.color_text}">${c.short}</div>
        <div class="card-kpi" style="color:${c.color_text}">
          <div class="kpi-val">${c.kpi_value}</div>
          <div class="kpi-lbl">${c.kpi_label}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-co">${c.company}</div>
        <div class="card-ttl">${c.title}</div>
        <div class="card-desc">${c.description}</div>
      </div>
      <div class="card-ft">
        <span>
          <span class="card-tag ${g}">${id}</span>
          ${isNew ? '<span class="card-new">NEW</span>' : ''}
        </span>
        <span class="card-see">자세히 보기 →</span>
      </div>
    </div>`;
  });
  h += '</div>';
  document.getElementById('center').innerHTML = h;
}

function selCard(catId, idx) {
  if (activeCard !== null) {
    const p = document.getElementById(`card-${activeCat}-${activeCard}`);
    if (p) p.classList.remove('sel');
  }
  activeCard = idx;
  const el = document.getElementById(`card-${catId}-${idx}`);
  if (el) el.classList.add('sel');

  const cat = DB.categories[catId];
  const cases = DB.cases.filter(c => c.category === catId);
  const c = cases[idx];
  const g = catGroupCls(catId);

  const mh = (c.metrics || []).map(m => `
    <div class="met">
      <div class="met-v ${m.trend || 'pos'}">${m.value}</div>
      <div class="met-l">${m.label}</div>
    </div>`).join('');

  const tagPills = (c.tags || []).map(t => `<span class="det-tag-pill">${t}</span>`).join('');

  document.getElementById('det-in').innerHTML = `
    <div class="det-hd">
      <div class="det-co">
        <div class="det-badge" style="background:${c.color_bg};color:${c.color_text}">${c.short}</div>
        <div>
          <div class="det-co-name">${c.company}</div>
          <div class="det-co-cat">${catId} ${cat.name}</div>
        </div>
      </div>
      <span class="det-close" onclick="closeDet()">×</span>
    </div>
    <span class="det-tag ${g}">${cat.sub || cat.name}</span>
    ${!c.verified ? '<div><span class="det-unverified">초안 (미검증)</span></div>' : ''}
    <div class="det-ttl">${c.title}</div>
    <div class="det-body">${c.body}</div>
    <div class="det-metrics">${mh}</div>
    <div class="det-src"><a href="${c.url}" target="_blank" rel="noopener">${c.source} ↗</a></div>
    <div class="det-tags">${tagPills}</div>`;

  document.getElementById('det').classList.add('open');
}

function closeDet() {
  document.getElementById('det').classList.remove('open');
  if (activeCard !== null) {
    const p = document.getElementById(`card-${activeCat}-${activeCard}`);
    if (p) p.classList.remove('sel');
    activeCard = null;
  }
}

loadData();
</script>
<script src="./nav.js"></script>
</body>
</html>
