<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소스 관리 — The AX Fieldbook</title>
<link rel="stylesheet" href="./shared.css">
<style>
body { padding-bottom: 80px; font-size: 14px; }

/* ── Admin header (sub-header below site nav) ─────────────── */
.hd{
  padding:13px 24px;border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:60px;background:var(--bg);z-index:30;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
.hd-left{display:flex;align-items:center;gap:12px;min-width:0}
.hd-title{font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.dirty-dot{width:7px;height:7px;border-radius:50%;background:#EF9F27;flex-shrink:0;display:none}
.dirty-dot.on{display:block}
.dirty-label{font-size:11px;color:var(--amber);display:none}
.dirty-dot.on + .dirty-label{display:block}
.hd-right{display:flex;align-items:center;gap:7px;flex-shrink:0}

/* Admin-specific button overrides (radius matches admin compact UI) */
.btn-green{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.btn-green:hover{opacity:.8}
.btn-sm{font-size:12px;padding:5px 11px;border-radius:6px}

/* ── Stats bar ────────────────────────────────────────────── */
.stats{
  padding:10px 24px;border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;gap:18px;background:var(--bg2);
  font-size:13px;color:var(--text3);flex-wrap:wrap
}
.stat{display:flex;align-items:center;gap:5px}
.stat-n{font-weight:700;color:var(--text);font-size:15px}
.stat-sep{width:0.5px;height:14px;background:var(--border2)}

/* ── Tabs ─────────────────────────────────────────────────── */
.tabs{
  padding:0 24px;border-bottom:0.5px solid var(--border);
  display:flex;gap:0
}
.tab{
  font-size:13px;font-weight:500;padding:11px 16px;cursor:pointer;
  border-bottom:2px solid transparent;color:var(--text3);
  transition:all .1s;user-select:none;white-space:nowrap
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--text)}

/* ── Table ────────────────────────────────────────────────────────────────── */
.tbl-wrap{padding:16px 24px 0;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th{
  font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.04em;
  padding:0 10px 9px;text-align:left;border-bottom:0.5px solid var(--border2);
  white-space:nowrap
}
td{
  padding:11px 10px;border-bottom:0.5px solid var(--border);
  vertical-align:middle
}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.td-id{font-family:monospace;font-size:12px;color:var(--text3)}
.td-name{font-weight:500;font-size:14px;line-height:1.3}
.td-url{font-size:12px;color:var(--text3);margin-top:2px;
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-url a{color:var(--blue);text-decoration:none}
.td-url a:hover{text-decoration:underline}

/* badges */
.badge{
  display:inline-flex;align-items:center;font-size:10px;font-weight:600;
  padding:2px 7px;border-radius:4px;white-space:nowrap
}
.badge-rss{background:var(--blue-bg);color:var(--blue)}
.badge-html{background:var(--amber-bg);color:var(--amber)}
.badge-high{background:var(--green-bg);color:var(--green)}
.badge-medium{background:var(--blue-bg);color:var(--blue)}
.badge-low{background:var(--bg3);color:var(--text3)}
.badge-research{background:#EDE9FE;color:#4C1D95}
.badge-vendor{background:var(--blue-bg);color:var(--blue)}
.badge-trade{background:var(--amber-bg);color:var(--amber)}
.badge-company{background:var(--green-bg);color:var(--green)}
@media(prefers-color-scheme:dark){
  .badge-research{background:#2e1065;color:#c4b5fd}
}

/* tags */
.tag-pills{display:flex;flex-wrap:wrap;gap:3px;max-width:180px}
.tag-pill{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--text3)}

/* toggle */
.toggle{position:relative;display:inline-block;width:32px;height:18px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.slider{
  position:absolute;inset:0;border-radius:18px;background:var(--bg3);
  transition:.2s;border:0.5px solid var(--border2)
}
.slider:before{
  content:"";position:absolute;width:12px;height:12px;border-radius:50%;
  background:#fff;left:2px;bottom:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)
}
input:checked + .slider{background:var(--green);border-color:var(--green-b)}
input:checked + .slider:before{transform:translateX(14px)}

/* row actions */
.row-actions{display:flex;gap:5px;align-items:center}

/* delete confirm inline */
.del-confirm{
  display:flex;align-items:center;gap:6px;
  background:var(--red-bg);padding:4px 8px;border-radius:6px;
  font-size:11px;color:var(--red)
}

/* ── Empty ────────────────────────────────────────────────────────────────── */
.empty-row td{
  text-align:center;padding:40px;color:var(--text3);
  font-size:13px
}

/* ── Modal ────────────────────────────────────────────────────────────────── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  backdrop-filter:blur(4px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px
}
.modal-bg.open{display:flex}
.modal{
  background:var(--bg);border-radius:14px;width:100%;max-width:520px;
  max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);
  border:0.5px solid var(--border2)
}
.modal-hd{
  padding:16px 20px 14px;border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--bg);z-index:1;border-radius:14px 14px 0 0
}
.modal-title{font-size:14px;font-weight:600}
.modal-close{
  font-size:20px;color:var(--text3);cursor:pointer;padding:0 4px;
  line-height:1;user-select:none
}
.modal-close:hover{color:var(--text)}
.modal-body{padding:18px 20px}
.modal-ft{
  padding:12px 20px;border-top:0.5px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px;
  position:sticky;bottom:0;background:var(--bg);border-radius:0 0 14px 14px
}

/* Form */
.form-row{margin-bottom:14px}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
label{
  display:block;font-size:11px;font-weight:600;color:var(--text3);
  margin-bottom:5px;letter-spacing:.02em
}
input[type=text],input[type=url],select,textarea{
  width:100%;padding:7px 10px;border:0.5px solid var(--border2);
  border-radius:7px;background:var(--bg2);color:var(--text);
  font-family:var(--font);font-size:12px;transition:border-color .1s;
  outline:none
}
input[type=text]:focus,input[type=url]:focus,select:focus,textarea:focus{
  border-color:var(--blue-b);background:var(--bg)
}
input.err{border-color:var(--red)!important}
.field-hint{font-size:10px;color:var(--text3);margin-top:3px}
.field-err{font-size:10px;color:var(--red);margin-top:3px;display:none}
.field-err.on{display:block}

/* Tag chip input */
.tag-input-box{
  border:0.5px solid var(--border2);border-radius:7px;
  background:var(--bg2);padding:5px 8px;
  display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:text;
  min-height:36px;transition:border-color .1s
}
.tag-input-box:focus-within{border-color:var(--blue-b);background:var(--bg)}
.tag-chip{
  display:inline-flex;align-items:center;gap:3px;
  font-size:11px;padding:2px 7px;border-radius:4px;
  background:var(--bg3);color:var(--text2)
}
.tag-chip button{
  background:none;border:none;cursor:pointer;color:var(--text3);
  font-size:13px;line-height:1;padding:0 1px
}
.tag-chip button:hover{color:var(--red)}
#tag-input{
  border:none;background:transparent;color:var(--text);
  font-size:12px;padding:2px 4px;outline:none;min-width:80px;flex:1
}

/* Form toggle row */
.form-toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;background:var(--bg2);border-radius:8px;margin-bottom:14px
}
.form-toggle-label{font-size:12px;font-weight:500}
.form-toggle-sub{font-size:11px;color:var(--text3);margin-top:1px}

/* ── Notice banner ────────────────────────────────────────────────────────── */
.notice{
  margin:14px 24px 0;padding:10px 14px;border-radius:8px;
  background:var(--amber-bg);border:0.5px solid var(--amber-b);
  font-size:11px;color:var(--amber);display:flex;align-items:center;gap:8px
}

/* ── Export toast ─────────────────────────────────────────────────────────── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#1a1a18;color:#e8e6df;font-size:12px;padding:9px 16px;
  border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;
  white-space:nowrap;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.3)
}
.toast.show{opacity:1}

@media(max-width:640px){
  .hd{padding:11px 14px}
  .stats{padding:8px 14px;gap:12px}
  .tabs{padding:0 14px}
  .tbl-wrap{padding:12px 14px 0}
  .notice{margin:10px 14px 0}
  .form-row-2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────────────────── -->
<header class="hd">
  <div class="hd-left">
    <span class="hd-title">소스 관리</span>
    <div class="dirty-dot" id="dirty-dot"></div>
    <span class="dirty-label" id="dirty-label">미저장 변경사항</span>
  </div>
  <div class="hd-right">
    <button class="btn btn-ghost" onclick="importFile()">JSON 가져오기</button>
    <input type="file" id="file-input" accept=".json" style="display:none" onchange="onFileImport(event)">
    <button class="btn btn-ghost" id="copy-btn" onclick="copyJSON()">클립보드 복사</button>
    <button class="btn btn-green" id="export-btn" onclick="exportJSON()">⬇ JSON 내보내기</button>
    <button class="btn btn-primary" onclick="openModal(null)">+ 소스 추가</button>
  </div>
</header>

<!-- ── Stats ─────────────────────────────────────────────────────────────── -->
<div class="stats" id="stats">
  <span class="stat"><span class="stat-n" id="st-active">–</span> 활성</span>
  <div class="stat-sep"></div>
  <span class="stat"><span class="stat-n" id="st-inactive">–</span> 비활성</span>
  <div class="stat-sep"></div>
  <span class="stat">RSS <span class="stat-n" id="st-rss">–</span></span>
  <span class="stat">HTML <span class="stat-n" id="st-html">–</span></span>
  <div class="stat-sep"></div>
  <span class="stat">제외 도메인 <span class="stat-n" id="st-excl">–</span></span>
  <div class="stat-sep"></div>
  <span class="stat" id="st-updated" style="margin-left:auto;color:var(--text3)"></span>
</div>

<!-- ── Notice ────────────────────────────────────────────────────────────── -->
<div class="notice">
  ⚠ 변경 후 <strong>JSON 내보내기</strong>로 다운로드 → <code style="font-size:10px;background:rgba(0,0,0,.1);padding:1px 4px;border-radius:3px">scraper/sources.json</code>에 저장하고 커밋하세요. 이 페이지의 변경사항은 파일에 자동 반영되지 않습니다.
</div>

<!-- ── Tabs ───────────────────────────────────────────────────────────────── -->
<div class="tabs">
  <div class="tab on" id="tab-active"   onclick="selTab('active')">활성 소스 <span id="tab-n-active"></span></div>
  <div class="tab"    id="tab-inactive" onclick="selTab('inactive')">비활성 <span id="tab-n-inactive"></span></div>
  <div class="tab"    id="tab-excluded" onclick="selTab('excluded')">제외 도메인 <span id="tab-n-excluded"></span></div>
</div>

<!-- ── Table ─────────────────────────────────────────────────────────────── -->
<div class="tbl-wrap">
  <table id="tbl">
    <thead id="tbl-head"></thead>
    <tbody id="tbl-body"><tr class="empty-row"><td>데이터 불러오는 중...</td></tr></tbody>
  </table>
</div>

<!-- ── Add/Edit Modal ─────────────────────────────────────────────────────── -->
<div class="modal-bg" id="modal-bg" onclick="bgClick(event)">
  <div class="modal" id="modal">
    <div class="modal-hd">
      <span class="modal-title" id="modal-title">소스 추가</span>
      <span class="modal-close" onclick="closeModal()">×</span>
    </div>
    <div class="modal-body">
      <div class="form-row-2">
        <div>
          <label>소스 ID <span style="font-weight:400;color:var(--text3)">(자동 생성)</span></label>
          <input type="text" id="f-id" placeholder="예: salesforce-blog">
          <div class="field-hint">URL 입력 시 자동 생성됩니다</div>
          <div class="field-err" id="err-id">이미 존재하는 ID입니다</div>
        </div>
        <div>
          <label>소스명</label>
          <input type="text" id="f-name" placeholder="예: Salesforce Blog — AI">
          <div class="field-err" id="err-name">소스명을 입력하세요</div>
        </div>
      </div>
      <div class="form-row">
        <label>섹션 URL</label>
        <input type="url" id="f-url" placeholder="https://example.com/ai-section/" oninput="autoId()">
        <div class="field-err" id="err-url">유효한 URL을 입력하세요</div>
      </div>
      <div class="form-row">
        <label>RSS 피드 URL <span style="font-weight:400;color:var(--text3)">(없으면 HTML 스크래핑)</span></label>
        <input type="url" id="f-rss" placeholder="https://example.com/feed/ (없으면 비워두세요)">
      </div>
      <div class="form-row-2">
        <div>
          <label>타입</label>
          <select id="f-type">
            <option value="research">research</option>
            <option value="vendor">vendor</option>
            <option value="trade">trade</option>
            <option value="company">company</option>
          </select>
        </div>
        <div>
          <label>우선순위</label>
          <select id="f-priority">
            <option value="high">high</option>
            <option value="medium">medium</option>
            <option value="low">low</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Expected Tags</label>
        <div class="tag-input-box" id="tag-box" onclick="focusTagInput()">
          <div id="tag-chips"></div>
          <input id="tag-input" type="text" placeholder="태그 입력 후 Enter 또는 쉼표"
            onkeydown="onTagKey(event)" onpaste="onTagPaste(event)">
        </div>
        <div class="field-hint">카테고리 커버리지 분석에 사용됩니다</div>
      </div>
      <div class="form-toggle-row">
        <div>
          <div class="form-toggle-label">활성화</div>
          <div class="form-toggle-sub">비활성화하면 스크래핑에서 제외됩니다</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="f-active" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveModal()">저장</button>
    </div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   State
═══════════════════════════════════════════════════════════════════════════ */
let state = null;   // full sources.json object (mutable)
let dirty = false;
let activeTab = 'active';
let editingId = null;  // null = new, string = editing
let currentTags = [];  // tags in the modal form
let confirmingDelete = null;  // id of row showing delete confirm

/* ═══════════════════════════════════════════════════════════════════════════
   Load
═══════════════════════════════════════════════════════════════════════════ */
async function load() {
  try {
    const res = await fetch('./data/sources.json');
    if (!res.ok) throw new Error(res.status);
    state = await res.json();
  } catch(e) {
    // Fallback: try scraper path (local dev)
    try {
      const res2 = await fetch('../scraper/sources.json');
      if (!res2.ok) throw new Error();
      state = await res2.json();
    } catch(_) {
      document.getElementById('tbl-body').innerHTML =
        `<tr class="empty-row"><td>sources.json 로드 실패.<br><small>로컬에서 실행 시 <code>docs/</code> 폴더를 HTTP로 서빙하거나 <strong>JSON 가져오기</strong>를 사용하세요.</small></td></tr>`;
      return;
    }
  }
  if (!state.sources) state.sources = [];
  if (!state.excluded_sources) state.excluded_sources = { domains: [] };
  if (!state.excluded_sources.domains) state.excluded_sources.domains = [];
  updateStats();
  render();
}

/* ═══════════════════════════════════════════════════════════════════════════
   Stats
═══════════════════════════════════════════════════════════════════════════ */
function updateStats() {
  const active   = state.sources.filter(s => s.active !== false);
  const inactive = state.sources.filter(s => s.active === false);
  const rss      = active.filter(s => s.rss);
  const html     = active.filter(s => !s.rss);
  const excl     = state.excluded_sources.domains.length;

  document.getElementById('st-active').textContent   = active.length;
  document.getElementById('st-inactive').textContent = inactive.length;
  document.getElementById('st-rss').textContent      = rss.length;
  document.getElementById('st-html').textContent     = html.length;
  document.getElementById('st-excl').textContent     = excl;
  document.getElementById('tab-n-active').textContent   = `(${active.length})`;
  document.getElementById('tab-n-inactive').textContent = `(${inactive.length})`;
  document.getElementById('tab-n-excluded').textContent = `(${excl})`;

  const upd = state.meta?.last_updated;
  if (upd) document.getElementById('st-updated').textContent =
    '최종 갱신: ' + new Date(upd).toLocaleDateString('ko-KR');
}

/* ═══════════════════════════════════════════════════════════════════════════
   Tabs
═══════════════════════════════════════════════════════════════════════════ */
function selTab(tab) {
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('on'));
  document.getElementById('tab-' + tab).classList.add('on');
  activeTab = tab;
  confirmingDelete = null;
  render();
}

/* ═══════════════════════════════════════════════════════════════════════════
   Render
═══════════════════════════════════════════════════════════════════════════ */
function render() {
  if (!state) return;
  if (activeTab === 'excluded') { renderExcluded(); return; }
  const isActive = activeTab === 'active';
  const rows = state.sources.filter(s => (s.active !== false) === isActive);

  document.getElementById('tbl-head').innerHTML = `<tr>
    <th style="width:140px">ID</th>
    <th>소스명 / URL</th>
    <th style="width:60px">방식</th>
    <th style="width:70px">타입</th>
    <th style="width:70px">우선순위</th>
    <th style="width:180px">Expected Tags</th>
    <th style="width:60px;text-align:center">활성</th>
    <th style="width:100px"></th>
  </tr>`;

  if (!rows.length) {
    document.getElementById('tbl-body').innerHTML =
      `<tr class="empty-row"><td colspan="8">소스가 없습니다.</td></tr>`;
    return;
  }

  document.getElementById('tbl-body').innerHTML =
    rows.map(s => sourceRow(s)).join('');
}

function sourceRow(s) {
  const method   = s.rss ? 'RSS' : 'HTML';
  const mCls     = s.rss ? 'badge-rss' : 'badge-html';
  const pCls     = s.priority === 'high' ? 'badge-high'
                 : s.priority === 'medium' ? 'badge-medium' : 'badge-low';
  const tCls     = `badge-${s.type || 'research'}`;
  const tags     = (s.expected_tags || []).slice(0, 4)
    .map(t => `<span class="tag-pill">${esc(t)}</span>`).join('');
  const checked  = s.active !== false ? 'checked' : '';

  const domId = CSS.escape(s.id);
  const isConfirming = confirmingDelete === s.id;

  return `<tr id="row-${domId}">
    <td class="td-id">${esc(s.id)}</td>
    <td>
      <div class="td-name">${esc(s.name)}</div>
      <div class="td-url"><a href="${esc(s.url||s.section_url||'')}" target="_blank" rel="noopener">${esc((s.url||s.section_url||'').replace(/^https?:\/\//,''))}</a></div>
    </td>
    <td><span class="badge ${mCls}">${method}</span></td>
    <td><span class="badge ${tCls}">${esc(s.type||'')}</span></td>
    <td><span class="badge ${pCls}">${esc(s.priority||'')}</span></td>
    <td><div class="tag-pills">${tags}</div></td>
    <td style="text-align:center">
      <label class="toggle" title="${s.active !== false ? '비활성화' : '활성화'}">
        <input type="checkbox" ${checked} onchange="toggleActive('${s.id}',this.checked)">
        <span class="slider"></span>
      </label>
    </td>
    <td>
      ${isConfirming
        ? `<div class="del-confirm">
             삭제?
             <button class="btn btn-danger btn-sm" onclick="confirmDelete('${s.id}')">삭제</button>
             <button class="btn btn-ghost btn-sm" onclick="cancelDelete()">취소</button>
           </div>`
        : `<div class="row-actions">
             <button class="btn btn-ghost btn-sm" onclick="openModal('${s.id}')">편집</button>
             <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="askDelete('${s.id}')">삭제</button>
           </div>`
      }
    </td>
  </tr>`;
}

function renderExcluded() {
  const list = state.excluded_sources.domains || [];

  document.getElementById('tbl-head').innerHTML = `<tr>
    <th style="width:240px">도메인</th>
    <th>제외 사유</th>
    <th style="width:80px"></th>
  </tr>`;

  if (!list.length) {
    document.getElementById('tbl-body').innerHTML =
      `<tr class="empty-row"><td colspan="3">제외된 도메인이 없습니다.</td></tr>`;
    return;
  }

  document.getElementById('tbl-body').innerHTML = list.map((d, i) => `
    <tr>
      <td class="td-id">${esc(d.domain)}</td>
      <td style="font-size:12px;color:var(--text2)">${esc(d.reason||'')}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="removeExcluded(${i})">제외 해제</button>
      </td>
    </tr>`).join('');
}

/* ═══════════════════════════════════════════════════════════════════════════
   Toggle active
═══════════════════════════════════════════════════════════════════════════ */
function toggleActive(id, val) {
  const s = state.sources.find(x => x.id === id);
  if (!s) return;
  s.active = val;
  markDirty();
  updateStats();
  render();
}

/* ═══════════════════════════════════════════════════════════════════════════
   Delete
═══════════════════════════════════════════════════════════════════════════ */
function askDelete(id) {
  confirmingDelete = id;
  render();
}
function cancelDelete() {
  confirmingDelete = null;
  render();
}
function confirmDelete(id) {
  const s = state.sources.find(x => x.id === id);
  if (!s) return;
  // Offer to add domain to excluded list
  const domain = extractDomain(s.url || s.section_url || '');
  const alreadyExcluded = state.excluded_sources.domains.some(d => d.domain === domain);
  if (domain && !alreadyExcluded) {
    const reason = prompt(`"${s.name}"을(를) 삭제합니다.\n\n도메인(${domain})을 제외 목록에 추가할 이유를 입력하세요.\n(건너뛰려면 취소 클릭)`, '');
    if (reason !== null) {
      state.excluded_sources.domains.push({ domain, reason: reason || '수동 삭제' });
    }
  }
  state.sources = state.sources.filter(x => x.id !== id);
  confirmingDelete = null;
  markDirty();
  updateStats();
  render();
  toast(`"${s.name}" 삭제됨`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   Remove excluded
═══════════════════════════════════════════════════════════════════════════ */
function removeExcluded(idx) {
  const d = state.excluded_sources.domains[idx];
  state.excluded_sources.domains.splice(idx, 1);
  markDirty();
  updateStats();
  render();
  toast(`${d.domain} 제외 해제됨`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   Modal
═══════════════════════════════════════════════════════════════════════════ */
function openModal(id) {
  editingId = id;
  currentTags = [];
  document.querySelectorAll('.field-err').forEach(el => el.classList.remove('on'));
  document.querySelectorAll('input[type=text],input[type=url],select').forEach(el => el.classList.remove('err'));

  if (id) {
    // Edit
    const s = state.sources.find(x => x.id === id);
    if (!s) return;
    document.getElementById('modal-title').textContent = '소스 편집';
    document.getElementById('f-id').value       = s.id;
    document.getElementById('f-id').readOnly    = true;
    document.getElementById('f-name').value     = s.name || '';
    document.getElementById('f-url').value      = s.url || s.section_url || '';
    document.getElementById('f-rss').value      = s.rss || '';
    document.getElementById('f-type').value     = s.type || 'research';
    document.getElementById('f-priority').value = s.priority || 'medium';
    document.getElementById('f-active').checked = s.active !== false;
    currentTags = [...(s.expected_tags || [])];
  } else {
    // New
    document.getElementById('modal-title').textContent = '소스 추가';
    document.getElementById('f-id').value       = '';
    document.getElementById('f-id').readOnly    = false;
    document.getElementById('f-name').value     = '';
    document.getElementById('f-url').value      = '';
    document.getElementById('f-rss').value      = '';
    document.getElementById('f-type').value     = 'trade';
    document.getElementById('f-priority').value = 'medium';
    document.getElementById('f-active').checked = true;
    currentTags = [];
  }
  renderTagChips();
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(() => document.getElementById(id ? 'f-name' : 'f-url').focus(), 50);
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}

function bgClick(e) {
  if (e.target === document.getElementById('modal-bg')) closeModal();
}

function saveModal() {
  const id       = document.getElementById('f-id').value.trim();
  const name     = document.getElementById('f-name').value.trim();
  const url      = document.getElementById('f-url').value.trim();
  const rssRaw   = document.getElementById('f-rss').value.trim();
  const type     = document.getElementById('f-type').value;
  const priority = document.getElementById('f-priority').value;
  const active   = document.getElementById('f-active').checked;

  // Validate
  let ok = true;
  if (!id) { showErr('id', 'ID를 입력하세요'); ok = false; }
  if (!name) { showErr('name', '소스명을 입력하세요'); ok = false; }
  if (!url || !url.startsWith('http')) { showErr('url', '유효한 URL을 입력하세요'); ok = false; }
  if (!editingId && state.sources.find(s => s.id === id)) {
    showErr('id', '이미 존재하는 ID입니다'); ok = false;
  }
  if (!ok) return;

  const entry = {
    id,
    name,
    url,
    rss: rssRaw || null,
    type,
    scrape_method: rssRaw ? 'rss' : 'html',
    expected_tags: [...currentTags],
    priority,
    active,
  };

  if (editingId) {
    const idx = state.sources.findIndex(s => s.id === editingId);
    if (idx >= 0) state.sources[idx] = { ...state.sources[idx], ...entry };
  } else {
    entry.added_by   = 'manual';
    entry.added_date = new Date().toISOString().slice(0, 10);
    state.sources.push(entry);
  }

  markDirty();
  updateStats();
  closeModal();
  render();
  toast(editingId ? `"${name}" 저장됨` : `"${name}" 추가됨`);
}

function showErr(field, msg) {
  const errEl = document.getElementById('err-' + field);
  const inEl  = document.getElementById('f-' + field);
  if (errEl) { errEl.textContent = msg; errEl.classList.add('on'); }
  if (inEl)  inEl.classList.add('err');
}

/* ═══════════════════════════════════════════════════════════════════════════
   Tag input
═══════════════════════════════════════════════════════════════════════════ */
function focusTagInput() { document.getElementById('tag-input').focus(); }

function renderTagChips() {
  document.getElementById('tag-chips').innerHTML =
    currentTags.map(t => `<span class="tag-chip">${esc(t)}
      <button type="button" onclick="removeTag('${esc(t)}')">×</button>
    </span>`).join('');
}

function addTag(val) {
  const v = val.trim().replace(/,$/, '');
  if (v && !currentTags.includes(v)) {
    currentTags.push(v);
    renderTagChips();
  }
  document.getElementById('tag-input').value = '';
}

function removeTag(t) {
  currentTags = currentTags.filter(x => x !== t);
  renderTagChips();
}

function onTagKey(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    addTag(e.target.value);
  } else if (e.key === 'Backspace' && !e.target.value && currentTags.length) {
    currentTags.pop();
    renderTagChips();
  }
}

function onTagPaste(e) {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text');
  text.split(/[,\n]+/).forEach(t => addTag(t));
}

/* ═══════════════════════════════════════════════════════════════════════════
   Auto-generate ID from URL
═══════════════════════════════════════════════════════════════════════════ */
function autoId() {
  if (editingId) return;
  const url = document.getElementById('f-url').value.trim();
  if (!url) return;
  try {
    const domain = new URL(url).hostname.replace(/^www\./, '');
    const parts  = domain.split('.');
    const base   = parts[0];
    // suggest id = base-slug
    const idEl = document.getElementById('f-id');
    if (!idEl.value || idEl.dataset.autoset === 'true') {
      idEl.value = base;
      idEl.dataset.autoset = 'true';
    }
    // auto-fill name if empty
    const nameEl = document.getElementById('f-name');
    if (!nameEl.value) nameEl.value = domain;
  } catch(_) {}
}

/* ═══════════════════════════════════════════════════════════════════════════
   Export / Import
═══════════════════════════════════════════════════════════════════════════ */
function exportJSON() {
  if (!state) return;
  const json = buildExport();
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sources.json';
  a.click();
  URL.revokeObjectURL(a.href);
  dirty = false;
  document.getElementById('dirty-dot').classList.remove('on');
  toast('sources.json 다운로드 완료');
}

function copyJSON() {
  if (!state) return;
  navigator.clipboard.writeText(buildExport()).then(() => toast('클립보드에 복사됨'));
}

function buildExport() {
  const out = {
    meta: {
      ...state.meta,
      last_updated: new Date().toISOString().slice(0, 10),
    },
    sources: state.sources,
    excluded_sources: state.excluded_sources,
    category_keywords: state.category_keywords,
  };
  return JSON.stringify(out, null, 2);
}

function importFile() { document.getElementById('file-input').click(); }

function onFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      state = JSON.parse(evt.target.result);
      if (!state.sources) state.sources = [];
      if (!state.excluded_sources) state.excluded_sources = { domains: [] };
      updateStats();
      render();
      toast(`${file.name} 가져오기 완료`);
    } catch(_) {
      toast('JSON 파싱 실패: 올바른 sources.json 파일인지 확인하세요');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ═══════════════════════════════════════════════════════════════════════════
   Dirty
═══════════════════════════════════════════════════════════════════════════ */
function markDirty() {
  dirty = true;
  document.getElementById('dirty-dot').classList.add('on');
}

/* ═══════════════════════════════════════════════════════════════════════════
   Toast
═══════════════════════════════════════════════════════════════════════════ */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ═══════════════════════════════════════════════════════════════════════════
   Helpers
═══════════════════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function extractDomain(url) {
  try { return new URL(url).hostname; } catch(_) { return ''; }
}

// Warn before closing with unsaved changes
window.addEventListener('beforeunload', e => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

load();
</script>
<script src="./nav.js"></script>
</body>
</html>
