<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trinity Eye — Life After AI</title>
<link rel="stylesheet" href="./shared.css">
<style>
body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

/* nav는 nav.js가 주입 — 64px 고정 */
.nav { flex-shrink: 0; }

/* iframe이 남은 전체 높이를 채움 */
.frame-wrap {
  flex: 1;
  position: relative;
  min-height: 0;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  background: var(--surface-soft);
}

/* 로딩 오버레이 */
.frame-loading {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--canvas);
  pointer-events: none;
  transition: opacity .3s;
}
.frame-loading.hidden { opacity: 0; }

.spinner {
  width: 28px; height: 28px;
  border: 2.5px solid var(--hairline);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.frame-loading p {
  font-size: 13px;
  color: var(--muted-soft);
  margin: 0;
}
</style>
</head>
<body>

<div class="frame-wrap">
  <div class="frame-loading" id="loading">
    <div class="spinner"></div>
    <p>Trinity Eye 불러오는 중...</p>
  </div>
  <iframe
    src="https://trinityszg-production.up.railway.app/"
    title="Trinity Eye"
    allow="fullscreen"
    id="trinity-frame"
  ></iframe>
</div>

<script src="./nav.js"></script>
<script>
document.getElementById('trinity-frame').addEventListener('load', () => {
  const loader = document.getElementById('loading');
  loader.classList.add('hidden');
  setTimeout(() => loader.remove(), 350);
});
</script>
</body>
</html>
