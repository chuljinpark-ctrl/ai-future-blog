name: Daily Article Update

on:
  schedule:
    # KST 10:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch & extract but do NOT write DB)'
        type: boolean
        default: false

permissions:
  contents: write
  models: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Run scrape + LLM extraction pipeline ────────────────────────────────
      - name: Run daily pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scraper
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python run_pipeline.py --dry-run
          else
            python run_pipeline.py
          fi

      # ── Sync sources → docs/data/ for GitHub Pages ───────────────────────────
      - name: Sync sources to docs
        if: github.event.inputs.dry_run != 'true'
        run: |
          mkdir -p docs/data
          cp scraper/sources.json docs/data/sources.json

      # ── Commit if anything changed ───────────────────────────────────────────
      - name: Commit changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "Life After AI Bot"
          git config user.email "bot@life-after-ai.internal"
          git add docs/data/cases.json docs/data/sources.json
          COUNT=$(python3 -c "import json; d=json.load(open('docs/data/cases.json')); print(len(d['cases']))")
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily update — ${COUNT} articles [$(date +'%Y-%m-%d KST')]"
            git pull --rebase origin main
            git push
          fi

      # ── Upload pipeline log ──────────────────────────────────────────────────
      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: scraper/pipeline.log
          retention-days: 30
