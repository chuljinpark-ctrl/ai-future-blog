name: Daily Benchmark Update

on:
  schedule:
    # KST 10:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB write)'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd scraper
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python run_pipeline.py --dry-run
          else
            python run_pipeline.py
          fi

      - name: Check for changes
        id: git_status
        run: |
          git diff --exit-code data/cases.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated cases.json
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git config --global user.name "LGE Benchmark Bot"
          git config --global user.email "benchmark-bot@lge-ax.internal"
          git add data/cases.json
          CASE_COUNT=$(python3 -c "import json; d=json.load(open('data/cases.json')); print(len(d['cases']))")
          git commit -m "chore: daily benchmark update — ${CASE_COUNT} cases [$(date +'%Y-%m-%d KST')]"
          git push

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: scraper/pipeline.log
          retention-days: 30
